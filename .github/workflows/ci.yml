name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        # Docker Hub rate-limits shared runner IPs; the same official image from the ECR mirror does not.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: hunter
          POSTGRES_PASSWORD: hunter
          POSTGRES_DB: hunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hunter -d hunter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://hunter:hunter@localhost:5432/hunter
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
