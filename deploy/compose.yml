# Production stack on the homelab (CT 121, /opt/deal-hunter). Deployed by deploy.sh.
# Secrets come from /opt/deal-hunter/.env (never committed): POSTGRES_PASSWORD, NTFY_TOKEN,
# NTFY_FEEDBACK_TOKEN, plus settings such as HUNTER_ALERTS_ENABLED (see .env.example).
name: deal-hunter

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d hunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off commands: docker compose run --rm hunter stats
  hunter: &hunter
    image: ghcr.io/michalomegalul/deal-hunter:${HUNTER_VERSION:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hunter:${POSTGRES_PASSWORD}@db:5432/hunter
    depends_on:
      db:
        condition: service_healthy
    profiles: ["cli"]

  # Every 10 minutes: RSS + first category pages, detail pages for new ads only.
  scraper:
    <<: *hunter
    command: ["scrape", "--loop"]
    restart: unless-stopped
    profiles: []

  # Every 6 hours: re-check ads that scrolled off the first pages; mark removed ones gone.
  rechecker:
    <<: *hunter
    command: ["recheck", "--loop"]
    restart: unless-stopped
    profiles: []

  # Every 5 minutes: fair prices, candidate deals, LLM triage (Ollama on CT 100), scoring, ntfy pushes
  # and the Sunday digest, plus the low-cadence auction step (nms.gov.cz IT lots) and the weekly
  # new-price step (Zboží.cz product pages).
  # The LLM answer cache lives in the hunterdata volume.
  worker:
    <<: *hunter
    command: ["work", "--loop"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hunter:${POSTGRES_PASSWORD}@db:5432/hunter
      HUNTER_LLM_CACHE: /home/hunter/data/llm_cache
    volumes:
      - hunterdata:/home/hunter/data
    mem_limit: 256m
    profiles: []

  # Holds the deals-feedback ntfy stream open: stores 👍/👎/"bought" taps as they happen and sends the
  # detailed follow-up for a 👍 within seconds (one Bazoš request, maybe an LLM call). Shares the LLM
  # cache with the worker.
  feedback:
    <<: *hunter
    command: ["feedback", "--loop"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hunter:${POSTGRES_PASSWORD}@db:5432/hunter
      HUNTER_LLM_CACHE: /home/hunter/data/llm_cache
    volumes:
      - hunterdata:/home/hunter/data
    mem_limit: 160m
    profiles: []

  # Facebook Marketplace, logged in as the owner (ban risk accepted, see facebook.py). A separate,
  # much bigger image (Playwright + Chromium, Dockerfile's `fb` stage) and its own profile, so it
  # never starts on a plain `docker compose up -d` -- only `docker compose --profile fb up -d
  # fb-scraper`, once FB_COOKIES_FILE on the host actually points at a fresh Cookie-Editor export.
  # Low and slow, every 20-30 min (jittered) -- not the main scraper's 10-minute loop.
  fb-scraper:
    <<: *hunter
    image: ghcr.io/michalomegalul/deal-hunter:${HUNTER_VERSION:-latest}-fb
    command: ["scrape-fb", "--loop"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hunter:${POSTGRES_PASSWORD}@db:5432/hunter
      FB_COOKIES_FILE: /run/secrets/fb_cookies.json
    volumes:
      - ${FB_COOKIES_FILE:?set FB_COOKIES_FILE (host path) to enable the fb-scraper profile}:/run/secrets/fb_cookies.json:ro
    mem_limit: 512m
    profiles: ["fb"]

volumes:
  pgdata:
  hunterdata:
