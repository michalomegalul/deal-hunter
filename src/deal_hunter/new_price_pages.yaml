# Zboží.cz product pages used for each GPU model's (and, since Phase 9, each disk class's) current new
# price (zbozi.py).
#
# Zboží's robots.txt allows product pages (/vyrobek/<slug>/) but not search or filtered listings, and
# the category listing is rendered in the browser, so models can't be looked up automatically. These
# pages were picked by hand on 2026-10-10 from Zboží's sitemap and from the "similar products" shown on
# product pages: 1-3 common budget cards per model that had offers then. A model's new price is the
# lowest offer across its pages; each page must normalize to the model it is listed under (checked on
# every read and in tests/test_zbozi.py).
#
# Checked 2026-10-10 by reading every page once: dropped were pages whose server HTML had no product
# data, a Gigabyte RX 9070 XT whose name our normalizer can't read (part number glued to the model),
# the RX 7800 XT (no offers left) and the RTX 5090 (only two marketplace offers at ~174 000 Kč, three
# times the MSRP: not a useful "new" price).
#
# Pages go stale (sold out, end of life): `hunt newprices` lists pages without offers. Replace them
# every few months. Keys are pricing keys ('rtx 3060 12gb', 'rtx 3070').
