  - {model: gtx 1050 ti, vram: [4]}
  - {model: gt 1030, vram: [2]}
  - {model: gtx 1060, vram: [3, 5, 6]}
  - {model: gtx 1070, vram: [8]}
  - {model: gtx 1070 ti, vram: [8]}
  - {model: gtx 1080, vram: [8]}
  - {model: gtx 1080 ti, vram: [11]}
