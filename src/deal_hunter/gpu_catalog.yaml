# Recognised GPUs we deliberately don't price (older or professional cards): excluded as out_of_scope
# instead of cluttering `hunt review`. These run on the prepared title (letters and digits split:
# 'R9 380' -> 'r 9 380', 'RX580' -> 'rx 580').
out_of_scope:
  - '\bgtx? \d{3}\b'                         # GTX 970, GT 710, GTX 750 Ti
  - '\bgt (?!1030\b)\d{4}\b'                 # GT 1030 is in the catalog
  - '\b(quadro|tesla|titan|firepro|radeon pro|grid)\b'
  - '\b\d{4} gt\b'                           # 9500GT, N9500GT
  - '\b(rx|radeon) (vega|[45]\d0)\b'         # RX 470/480/570/580/590, RX Vega
  - '\brx \d{3}\b'
  - '\br [579] \d{3}\b'                      # R9 380, R7 370
  - '\bhd \d{4}\b'                           # Radeon HD 7850
  - '\bvega( \d{1,2})?\b'
  - '^(?=.*\b(nvidia|quadro|tesla|pny)\b).*\b[ptkma] \d{3,4}\b'   # Quadro P4000, RTX A4000, Tesla K40
  - '\b\d{3,4} m\b'                          # mobile chips: HD 6770M, 960M
  - '\bmxm\b'
  - '\b\d{3,4} (gs|gso|le)\b'                # GeForce 7300 GS, 8400 GS
  - '\bati\b'
  - '\bnvs\b'
  - '\bgv n ?\d{2,3}\b'                      # Gigabyte part numbers: GV-N730, GV-N56GOC
  - '\ben ?gt \d{3}\b'                       # Asus ENGT520
  - '\bgtx n \d{3}\b'                        # MSI N760
  - '\brtx (pro )?\d{4} (pro|ada)\b'         # RTX PRO 6000, RTX 4000 Ada
  - '\brtx pro\b'
  - '\b(rtx )?a [2-6]000\b'                  # RTX A4000 (and PNY's 'VCNRTX A4000')
  - '\bradeon (x \d{3,4}|9\d{3}|\d{4} (pro|se))\b'  # Radeon X1600, Radeon 9250
