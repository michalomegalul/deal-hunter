# Canonical GPU models for the normalizer (src/deal_hunter/normalize.py).
#
# A model is found by its number plus an optional suffix ("3060 ti", "6700 xt", "a770"), after the
# title has been normalized: lower case, letters and digits split apart ("rtx3080ti" -> "rtx 3080 ti"),
# aliases applied. `vram` lists the memory sizes the model was sold with; when there is more than
# one, the title has to name the size (e.g. "12GB") or vram_gb stays empty.
#
# Bump `version` whenever the rules change, so `hunt normalize` re-processes old listings.
version: 1

# Applied (as regexes, on the normalized title) before matching.
aliases:
  '\b(\d{4}) ?s\b': '\1 super'          # 1660s, 2070s, 4070s
  '\b(\d{4}) ?ti ?s\b': '\1 ti super'   # 4070tis

