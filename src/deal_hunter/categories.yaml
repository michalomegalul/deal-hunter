# The category tree (categories.py). A shop-style menu, physically modelled on Datart's own:
#
#   pocitace > notebooky > {office_laptop, herni, apple, ostatni}
#   pocitace > stolni > {office_pc, herni_pc, apple_desktop}
#   komponenty > {gpu, procesory, pameti, zakladni_desky, skrine}
#   uloziste > hdd
#   sit
#
# Every notebooky leaf (office_laptop, herni, apple, ostatni), office_pc and apple_desktop under
# stolni, plus gpu and hdd, are priced today (priced: true) -- they are the exact ids
# normalize.py/office.py/storage.py/apple.py/laptop_spec.py already emit, unchanged, so no database
# data moves and no migration is needed (categories.leaves(priced=True) is the current list). Every
# other leaf (herni_pc, procesory, pameti, zakladni_desky, skrine, sit) is still a placeholder
# (priced: false, spec_adjust: false, no sections yet) for the catalogs Phase 3 will fill in; they
# are kept out of alerting (alerts.py only ever sees a `category` that came from a priced normalizer
# result) until then.
#
# `sections` lists the Bazoš sections (bazos.SECTIONS) that feed a leaf, home section first: the
# section whose ads normalize into this leaf by default (categories.for_section). A section can
# feed more than one leaf (both office_pc and office_laptop drew their alert-gate history from both
# "pc" and "notebook", a historical choice kept as-is for behaviour parity).
#
# `groups` are not part of the physical tree above: they are categories the normalizers can emit
# that never carry a model and are never priced or alerted, documented in categories.py's module
# docstring (`"office"` = office_pc + office_laptop, the unmatched-business-line bucket; `"watch"` =
# a watch-only section's ads, matched only by watchlist.py). `"out_of_scope"` is never a category
# value (always an excluded_reason instead), so it has no node or group here.

nodes:
  - id: pocitace
    parent: null
    name: "Počítače"
    icon: computer

  - id: notebooky
    parent: pocitace
    name: "Notebooky"
    icon: laptop

  - id: office_laptop
    parent: notebooky
    name: "Kancelářské"
    noun: notebook
    icon: computer
    triage_label: "business laptop"
    priced: true
    spec_adjust: true
    sections: [notebook, pc]

  - id: herni
    parent: notebooky
    name: "Herní"
    noun: "herní notebook"
    icon: joystick
    triage_label: "gaming laptop"
    priced: true
    spec_adjust: true
