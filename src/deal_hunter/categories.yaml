    priced: false

  - id: apple_desktop
    parent: stolni
    name: "Apple"
    noun: "Apple počítač"
    icon: apple
    triage_label: "Apple desktop"
    priced: true
    spec_adjust: true
    sections: [pc, notebook]

  - id: komponenty
    parent: null
    name: "Komponenty"
    icon: control_knobs

  - id: gpu
    parent: komponenty
    name: "Grafické karty"
