[project]
name = "deal-hunter"
version = "0.11.0"
description = "Watches Bazoš.cz GPU, ex-office PC/laptop and hard disk listings and state IT auctions, learns fair prices and flags the genuinely good deals."
readme = "README.md"
authors = [
    { name = "michalomegalul", email = "dog560154@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.0",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
# Facebook Marketplace only; keeps the main image (Dockerfile) and every other source dependency-free.
# `uv sync --extra fb && uv run playwright install chromium --with-deps` (see docker-compose.yml's
# fb-scraper service, which is the only place this gets installed).
fb = ["playwright>=1.47"]

[project.scripts]
hunt = "deal_hunter.cli:main"

[tool.ruff]
line-length = 110

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
